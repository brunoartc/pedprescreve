<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Prescrição</title>
  <style>
    :root {
      --green: #0f766e;
      --green-dark: #115e59;
      --green-light: #ccfbf1;
      --green-xlight: #f0fdfa;
      --bg: #ecfdf5;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --red: #ef4444;
      --red-light: #fee2e2;
      --amber: #b45309;
      --amber-light: #fef9c3;
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 155ms;
      --dur-mid: 275ms;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(145deg, var(--bg), #f0fdf4);
      color: var(--ink);
      min-height: 100vh;
      animation: pageIn 440ms var(--ease-smooth);
    }

    .empty-state {
      max-width: 720px;
      margin: 26px auto;
      background:
        radial-gradient(circle at 0% 0%, #ccfbf1 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #dcfce7 0%, transparent 45%),
        var(--surface);
      border: 1px solid #bae6fd;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 48px rgba(15, 118, 110, 0.12);
      animation: floatIn 440ms var(--ease-smooth);
    }
    .empty-state h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: var(--green-dark);
    }
    .empty-state p {
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .empty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .empty-hint {
      background: #ecfeff;
      color: #0f766e;
      border: 1px solid #99f6e4;
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      animation: softPulse 1.9s ease-in-out infinite;
    }
    .empty-drop {
      border: 2px dashed #94a3b8;
      border-radius: 14px;
      background: #ffffffb8;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-smooth);
      user-select: none;
    }
    .empty-drop:hover {
      border-color: var(--green);
      background: var(--green-xlight);
      color: #0f766e;
    }
    .empty-drop.over {
      border-color: var(--green);
      background: var(--green-xlight);
      box-shadow: inset 0 0 0 1px #99f6e4;
      transform: translateY(-1px) scale(1.005);
    }
    .empty-drop strong {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 4px;
      color: #134e4a;
    }

    /* ── WIZARD ── */
    #mainScreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .wiz-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 8px 14px 0;
      flex-shrink: 0;
      animation: slideDown 360ms var(--ease-smooth);
    }
    .wiz-header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .wiz-header-spacer { flex: 1; }
    .file-chip {
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      transition: transform var(--dur-fast) var(--ease-smooth), box-shadow var(--dur-fast) var(--ease-smooth);
    }
    .file-chip.pop {
      animation: popIn 290ms var(--ease-smooth);
    }
    .mini-upload-btn {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-smooth), background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .mini-upload-btn:hover {
      background: var(--green-xlight);
      border-color: #99f6e4;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.14);
    }
    .stepper {
      display: flex;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }
    .stepper::-webkit-scrollbar { display: none; }
    .step-tab {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      transition: all var(--dur-fast) var(--ease-smooth);
      user-select: none;
    }
    .step-tab:hover { background: var(--green-xlight); color: var(--green-dark); }
    .step-tab.done { color: var(--green-dark); }
    .step-tab.done .step-num { animation: popIn 220ms var(--ease-smooth); }
    .step-tab.active {
      border-bottom-color: var(--green);
      color: var(--green-dark);
      font-weight: 700;
      transform: translateY(-1px);
    }
    .step-num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--line);
      display: grid; place-items: center;
      font-size: 0.74rem; font-weight: 700;
      flex-shrink: 0;
    }
    .step-tab.active .step-num { background: var(--green); color: #fff; }
    .step-tab.done .step-num { background: var(--green-dark); color: #fff; }

    /* ── BODY / FOOTER ── */
    .wiz-body { flex: 1; overflow-y: auto; padding: 20px; }
    .wiz-body.step-anim .reveal-item {
      animation: floatIn 360ms var(--ease-smooth) both;
      animation-delay: calc(var(--stagger, 0) * 1ms);
    }
    .wiz-footer {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      animation: slideUp 360ms var(--ease-smooth);
    }
    .step-counter { color: var(--muted); font-size: 0.84rem; font-weight: 600; }

    /* ── STEP TITLE ── */
    .step-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .step-desc { color: var(--muted); margin-bottom: 20px; line-height: 1.45; }

    /* ── BUTTONS ── */
    .btn {
      border: 0; border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700; cursor: pointer;
      font-family: inherit; font-size: 0.9rem;
      transition: transform var(--dur-fast) var(--ease-smooth), background var(--dur-fast), box-shadow var(--dur-fast), filter var(--dur-fast);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.13);
      filter: saturate(1.02);
    }
    .btn:active { transform: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-ghost { background: #e2e8f0; color: var(--ink); }
    .btn-ghost:hover { background: #cbd5e1; }
    .btn-add { background: var(--green-light); color: var(--green-dark); }
    .btn-danger { background: var(--red-light); color: var(--red); }
    .btn-sm { padding: 6px 10px; font-size: 0.82rem; border-radius: 8px; }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform var(--dur-fast) var(--ease-smooth), box-shadow var(--dur-fast) var(--ease-smooth);
    }
    .card:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); }
    .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; }

    /* ── ACCORDION ── */
    .accordion {
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      background: var(--surface);
      transition: box-shadow var(--dur-fast) var(--ease-smooth), transform var(--dur-fast) var(--ease-smooth);
    }
    .accordion:hover { box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); transform: translateY(-1px); }
    .accordion-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      background: var(--surface-2);
      user-select: none;
    }
    .accordion-head:hover { background: var(--green-xlight); }
    .accordion-title { font-weight: 700; }
    .accordion-meta { display: flex; align-items: center; gap: 8px; }
    .acc-badge {
      background: var(--green-light); color: var(--green-dark);
      border-radius: 999px; padding: 2px 8px;
      font-size: 0.74rem; font-weight: 700;
    }
    .acc-arrow {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #b8c3d4;
      background: #f8fafc;
      color: var(--green-dark);
      display: grid;
      place-items: center;
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1;
      transition: transform 200ms, background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .accordion-head:hover .acc-arrow {
      background: #ecfeff;
      border-color: #99f6e4;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.18);
    }
    .acc-arrow.open { transform: rotate(180deg); }
    .accordion-body {
      border-top: 1px solid var(--line);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 16px;
      transition: max-height var(--dur-mid) var(--ease-smooth), opacity var(--dur-mid) var(--ease-smooth), padding var(--dur-mid) var(--ease-smooth);
    }
    .accordion-body.open {
      max-height: 99999px;
      opacity: 1;
      overflow: visible;
      padding: 16px;
    }

    /* ── FORM ── */
    .fg { display: grid; gap: 14px; }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label {
      font-size: 0.76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: #475569;
    }
    .field input, .field select, .field textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--ink);
      background: #fff;
      width: 100%;
      font-family: inherit;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid var(--green);
      outline-offset: 1px;
      transform: translateY(-1px);
    }

    /* ── CONDITIONS ── */
    .conditions-list { display: grid; gap: 8px; margin-bottom: 8px; }
    .cond-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1.5fr auto;
      gap: 6px; align-items: center;
    }
    .cond-row select, .cond-row input {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.86rem;
      color: var(--ink);
      background: #fff;
      font-family: inherit;
    }
    .empty-note { color: var(--muted); font-size: 0.84rem; margin: 4px 0 8px; font-style: italic; }

    /* ── COLOR SWATCHES ── */
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color var(--dur-fast), transform var(--dur-fast), box-shadow var(--dur-fast);
    }
    .swatch:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(15, 23, 42, 0.1); }
    .swatch.selected { border-color: var(--green); }

    /* ── CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      background: var(--green-light); color: var(--green-dark);
      border-radius: 999px; padding: 4px 10px;
      font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      animation: popIn 270ms var(--ease-smooth);
    }
    .chip-rm { cursor: pointer; opacity: 0.6; }
    .chip-rm:hover { opacity: 1; }

    /* ── PRESENTATION ROW ── */
    .pres-item {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: transform var(--dur-fast) var(--ease-smooth), box-shadow var(--dur-fast) var(--ease-smooth);
    }
    .pres-item:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08); }
    .pres-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .pres-label { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .pres-grid { display: grid; grid-template-columns: 1.7fr 1fr 1fr 2fr; gap: 8px; }
    .pres-grid .field label { font-size: 0.72rem; }

    /* ── ADD ROW ── */
    .add-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }

    /* ── MED CLINICAL LAYOUT ── */
    .med-layout {
      display: grid;
      grid-template-columns: minmax(0, 2.4fr) minmax(260px, 1fr);
      gap: 12px;
      align-items: start;
    }
    .med-main { min-width: 0; }
    .med-side {
      position: sticky;
      top: 10px;
      display: grid;
      gap: 10px;
    }
    .med-side-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .med-side-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #475569;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .med-kpi {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .med-kpi div {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px;
      font-size: 0.8rem;
      color: #334155;
    }
    .med-kpi strong { display: block; font-size: 1rem; color: #0f172a; }
    .section-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .section-tab-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .section-tab-btn.active {
      background: #ecfeff;
      color: #0f766e;
      border-color: #99f6e4;
    }
    .mode-tabs {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .mode-tab-btn {
      border: 0;
      background: #fff;
      color: #334155;
      padding: 5px 11px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-tab-btn.active { background: #0f766e; color: #fff; }
    .clinical-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .clinical-chip {
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
    }
    .clinical-chip.accent {
      background: #ecfeff;
      border-color: #99f6e4;
      color: #0f766e;
    }
    .clinical-view-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .clinical-view-item {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      color: #334155;
    }
    .clinical-view-item strong { color: #0f172a; }
    .pos-group {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
    }
    .pos-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      font-size: 0.78rem;
      color: #334155;
      font-weight: 700;
    }
    .pos-group-head small {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 600;
    }
    .med-main .field input,
    .med-main .field select,
    .med-main .field textarea {
      padding: 6px 9px;
      font-size: 0.88rem;
    }
    .med-main .field label { font-size: 0.69rem; }
    .pres-table {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .pres-table-head,
    .pres-table-row {
      display: grid;
      grid-template-columns: 1.3fr 2.2fr .8fr .8fr .8fr 1.3fr;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
    }
    .pres-table-head {
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #475569;
      font-weight: 700;
    }
    .pres-table-row {
      border-bottom: 1px solid #eef2f7;
      font-size: 0.82rem;
      color: #0f172a;
    }
    .pres-table-row:last-child { border-bottom: 0; }
    .pres-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-xs {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 3px 7px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-xs.primary { background: #ecfeff; color: #0f766e; border-color: #99f6e4; }
    .btn-xs.danger { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

    /* ── DIVIDER ── */
    .hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

    /* ── SEVERITY CARDS ── */
    .thresh-card {
      border-left: 4px solid;
      border-radius: 0 12px 12px 0;
    }
    .thresh-card[data-sev="low"] { border-left-color: #16a34a; }
    .thresh-card[data-sev="medium"] { border-left-color: #d97706; }
    .thresh-card[data-sev="high"] { border-left-color: #dc2626; }

    /* ── DOWNLOAD ── */
    .dl-card {
      background: var(--green-light);
      border: 2px solid var(--green);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      margin-bottom: 16px;
      animation: floatIn 390ms var(--ease-smooth);
    }
    .dl-card h2 { color: var(--green-dark); margin-bottom: 8px; }
    .dl-card p { color: #475569; margin-bottom: 18px; }
    .json-preview {
      background: #1e293b; color: #e2e8f0;
      border-radius: 14px; padding: 16px;
      font-family: monospace; font-size: 0.8rem;
      overflow: auto; max-height: 48vh;
      white-space: pre;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 80px;
      left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 0.88rem; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 210ms, transform 210ms var(--ease-smooth); z-index: 200;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    @keyframes pageIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      75% { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes softPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.0); }
      50% { box-shadow: 0 0 0 6px rgba(20, 184, 166, 0.14); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .frow, .pres-grid { grid-template-columns: 1fr; }
      .med-layout { grid-template-columns: 1fr; }
      .med-side { position: static; }
      .pres-table-head, .pres-table-row { grid-template-columns: 1fr; }
      .cond-row { grid-template-columns: 1fr 1fr; }
      .cond-row .btn-sm { grid-column: 1 / -1; justify-self: end; }
    }
  </style>
</head>
<body>

<!-- ══════════ WIZARD ══════════ -->
<div id="mainScreen">
  <header class="wiz-header">
    <div class="wiz-header-top">
      <span class="file-chip" id="fileChip"></span>

    <button class="btn btn-primary" id="nextBtn" type="button">Avançar →</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const STEPS = [
  { id: 'info',         label: 'Informações' },
  { id: 'perguntas',    label: 'Perguntas' },
  { id: 'score',        label: 'Score' },
  { id: 'alertas',      label: 'Alertas' },

const PRESC_TYPES = [

];
const STATUS_OPTS = [
  { v: 'draft', label: 'Rascunho' },
  { v: 'active', label: 'Ativo' },
  { v: 'archived', label: 'Arquivado' },
];
const FIELD_TYPES = [

const OPERATORS = [

  { v: '==', label: '= (igual)' },

const SEVERITIES = [

  { v: 'medium', label: '🟡 Risco moderado' },
  { v: 'high',   label: '🔴 Alto risco' },
];
const ALERT_COLORS = [
  { label: '🟢 Verde – baixo risco',   color: '#2e7d3220', text_color: '#1b5e20' },
  { label: '🟡 Amarelo – moderado',    color: '#f59e0b20', text_color: '#b45309' },
  { label: '🔴 Vermelho – alto risco', color: '#e5393520', text_color: '#c62828' },
  { label: '🟠 Laranja – atenção',     color: '#ff6f0020', text_color: '#e65100' },

];
const ICONS = [
  { v: 'check-circle',  label: '✅ Tudo bem' },
  { v: 'warning-amber', label: '⚠️ Atenção' },
  { v: 'block',         label: '🚫 Bloqueado' },
  { v: 'info',          label: 'ℹ️ Informação' },
];
const FREQUENCIES = [
  { v: 0,  label: 'Dose única' },
  { v: 4,  label: 'A cada 4 horas' },
  { v: 6,  label: 'A cada 6 horas (4×/dia)' },
  { v: 8,  label: 'A cada 8 horas (3×/dia)' },
  { v: 12, label: 'A cada 12 horas (2×/dia)' },
  { v: 24, label: 'Uma vez por dia' },
];
const DURATIONS = [
  { v: 0,  label: 'Uso sintomático (sem data de fim)' },
  { v: 1,  label: '1 dia' },
  { v: 3,  label: '3 dias' },
  { v: 5,  label: '5 dias' },
  { v: 7,  label: '7 dias' },
  { v: 10, label: '10 dias' },
  { v: 14, label: '14 dias' },
];
const DOSAGE_UNITS = ['mg', 'UI', 'mcg', 'ml', 'gotas'];
const ADMIN_ROUTES = [
  { v: 'oral',        label: 'Via oral' },
  { v: 'IM',          label: 'Intramuscular (IM)' },
  { v: 'IV',          label: 'Intravenoso (IV)' },
  { v: 'subcutâneo',  label: 'Subcutâneo' },
  { v: 'nasal',       label: 'Nasal' },
  { v: 'tópico',      label: 'Tópico' },
];
const PRES_UNITS = [
  'ml', 'gotas',
  'UN (de comprimido)', 'UN (de cápsula)', 'UN (de sachê)',
  'frascos',
];
const CATEGORIES = [
  'Antibióticos','Sintomáticos','Antiviral','Corticoide','Antifúngico','Outro'
];
const BOOL_COND_OPTS = [
  { v: 'true',  label: 'Sim (true)' },
  { v: 'false', label: 'Não (false)' },
];
const RESULT_TYPES = [
  { v: 'medication',   label: 'Medicamento' },
  { v: 'prescription', label: 'Texto livre' },
];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const S = { data: null, step: 0, fileName: 'prescricao.json' };
const OPEN_ACCORDIONS = new Set();
const MED_EDITOR_SECTION = new Map();
const MED_EDITOR_MODE = new Map();

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function getFieldIds() {
  if (!S.data || !S.data.form_fields) return ['score'];
  return [...S.data.form_fields.map(f => f.field_id), 'score'];
}
function getFieldType(fieldId) {
  if (!S.data || !S.data.form_fields) return null;
  const f = S.data.form_fields.find(f => f.field_id === fieldId);
  return f ? f.form_type : null;
}
function getFieldById(fieldId) {
  if (!S.data || !S.data.form_fields) return null;
  return S.data.form_fields.find(f => f.field_id === fieldId) || null;
}
function getFieldOptions(fieldId) {
  const field = getFieldById(fieldId);
  if (!field || field.form_type !== 'select' || !Array.isArray(field.options)) return [];
  return field.options.map((opt) => {
    if (typeof opt === 'object') {
      const val = opt.value !== undefined ? opt.value : (opt.v !== undefined ? opt.v : opt.label);
      return { v: String(val), label: String(opt.label !== undefined ? opt.label : val) };
    }
    return { v: String(opt), label: String(opt) };
  });
}
function getMedIds() {
  if (!S.data || !S.data.medications) return [];
  return S.data.medications.map(m => m.medication_id);
}

function fmtFrequency(hours) {
  const found = FREQUENCIES.find((f) => Number(f.v) === Number(hours));
  return found ? found.label : (hours ? ('a cada ' + hours + 'h') : '-');
}

function fmtDuration(days) {
  const found = DURATIONS.find((d) => Number(d.v) === Number(days));
  return found ? found.label : (days ? (days + ' dias') : '-');
}

function getMedSectionKey(mi) {
  return 'med-' + mi;
}

function getMedSection(mi) {
  return MED_EDITOR_SECTION.get(getMedSectionKey(mi)) || 'dados';
}

function setMedSection(mi, section) {
  MED_EDITOR_SECTION.set(getMedSectionKey(mi), section);
}

function getMedMode(mi) {
  return MED_EDITOR_MODE.get(getMedSectionKey(mi)) || 'view';
}

function setMedMode(mi, mode) {
  MED_EDITOR_MODE.set(getMedSectionKey(mi), mode);
}

function formatPosologyLine(med) {
  const idx = Number.isFinite(Number(med.default_posology_idx)) ? Number(med.default_posology_idx) : 0;
  const list = Array.isArray(med.posology) ? med.posology : [];
  const pos = list[Math.max(0, Math.min(idx, Math.max(0, list.length - 1)))];
  if (!pos) return 'sem posologia';
  const dose = (pos.default_dosage ?? 0) + ' ' + (pos.dosage_unit || 'mg');
  const via = pos.administration || 'oral';
  const freq = fmtFrequency(med.default_frequency_hours);
  const dur = fmtDuration(med.default_duration_days);
  return dose + ' • ' + via + ' • ' + freq + ' • ' + dur;
}

function getMedicationTags(med) {
  const tags = [];
  const cat = String(med.category || '').toLowerCase();
  if (cat.includes('antib')) tags.push('Antibiótico');
  if (Array.isArray(med.posology) && med.posology.some((p) => Number(p.age_month_max) <= 216)) tags.push('Pediátrico');
  if (Number(med.default_duration_days) === 0) tags.push('Se necessário');
  if (Number(med.default_duration_days) >= 14) tags.push('Contínuo');
  return tags;
}

function normalizePresentationData(pres) {
  if (!pres || typeof pres !== 'object') return;

  if (pres.presentation_notes === undefined) {
    pres.presentation_notes = '';
  }

  const rawUnit = String(pres.presentation_unit || '').trim();
  const m = rawUnit.match(/^([^()]+?)\s*\((.+)\)\s*$/);
  if (!m) return;

  const baseUnit = m[1].trim();
  const complement = m[2].trim();
  const currentNotes = String(pres.presentation_notes || '').trim();

  pres.presentation_unit = baseUnit;
  if (!currentNotes) {
    pres.presentation_notes = complement;
    return;
  }
  if (!currentNotes.includes(complement)) {
    pres.presentation_notes = currentNotes + '\n' + complement;
  }
}

function normalizeLoadedData(data) {
  if (!data || !Array.isArray(data.medications)) return;
  data.medications.forEach((med) => {
    if (!Array.isArray(med.posology)) return;
    med.posology.forEach((pos) => {
      if (!Array.isArray(pos.presentations)) return;
      pos.presentations.forEach((pres) => normalizePresentationData(pres));
    });
  });
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// Create element shorthand
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Build a <select> from options array
function mkSel(options, current, onChange) {
  const s = document.createElement('select');
  options.forEach(o => {
    const opt = document.createElement('option');
    const val = typeof o === 'object' ? String(o.v !== undefined ? o.v : o.value) : String(o);
    opt.value = val;
    opt.textContent = typeof o === 'object' ? o.label : o;
    if (val === String(current)) opt.selected = true;
    s.appendChild(opt);
  });
  if (onChange) s.addEventListener('change', () => onChange(s.value));
  return s;
}

// Build <input>
function mkInp(type, value, onChange, placeholder) {
  const i = document.createElement('input');
  i.type = type;
  i.value = value !== undefined && value !== null ? value : '';
  if (placeholder) i.placeholder = placeholder;
  if (onChange) i.addEventListener('change', () => {
    onChange(type === 'number' ? (i.value === '' ? 0 : Number(i.value)) : i.value);
  });
  return i;
}

// Wrap control in a labelled .field div
function mkField(label, control) {
  const wrap = el('div', 'field');
  const lbl = el('label', null, label);
  wrap.appendChild(lbl);
  wrap.appendChild(control);
  return wrap;
}

function mkHr(parent) { parent.appendChild(el('hr', 'hr')); }

function mkTitle(parent, title, desc) {
  parent.appendChild(el('h2', 'step-title reveal-item', title));
  if (desc) parent.appendChild(el('p', 'step-desc reveal-item', desc));
}

function syncAccordionHeight(body, isOpen) {
  if (!body) return;
  if (!isOpen) {
    body.style.setProperty('--acc-max-height', '0px');
    return;
  }
  requestAnimationFrame(() => {
    const h = Math.max(body.scrollHeight + 40, 280);
    body.style.setProperty('--acc-max-height', h + 'px');
  });
}

function animateStepEntrance() {
  const body = document.getElementById('wizBody');
  body.classList.remove('step-anim');
  void body.offsetWidth;
  body.classList.add('step-anim');

  const targets = body.querySelectorAll('.reveal-item, .card, .accordion, .pres-item, .dl-card, .empty-state');
  targets.forEach((node, index) => {
    node.classList.add('reveal-item');
    node.style.setProperty('--stagger', String(Math.min(index, 14) * 38));
  });
}

// Build accordion panel
function mkAccordion(title, badge, openByDefault, fillFn, accordionId) {
  const startsOpen = accordionId ? OPEN_ACCORDIONS.has(accordionId) : false;
  const acc = el('div', 'accordion');
  const head = el('div', 'accordion-head');
  head.appendChild(el('span', 'accordion-title', title));

  const meta = el('div', 'accordion-meta');
  if (badge) meta.appendChild(el('span', 'acc-badge', badge));
  const arrow = el('span', 'acc-arrow' + (startsOpen ? ' open' : ''), '▾');
  meta.appendChild(arrow);
  head.appendChild(meta);

  const body = el('div', 'accordion-body' + (startsOpen ? ' open' : ''));
  fillFn(body);
  syncAccordionHeight(body, startsOpen);

  function setOpen(nextOpen) {
    body.classList.toggle('open', nextOpen);
    arrow.classList.toggle('open', nextOpen);
    if (accordionId) {
      if (nextOpen) OPEN_ACCORDIONS.add(accordionId);
      else OPEN_ACCORDIONS.delete(accordionId);
    }
    syncAccordionHeight(body, nextOpen);
  }

  head.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    setOpen(!body.classList.contains('open'));
  });

  acc.appendChild(head);
  acc.appendChild(body);
  return acc;
}

// ═══════════════════════════════════════════════
// FILE LOADING
// ═══════════════════════════════════════════════
function parseLenient(text) {
  console.log('[editor_prescricao] parseLenient:start', {
    textLength: typeof text === 'string' ? text.length : null,
    preview: typeof text === 'string' ? text.slice(0, 120) : null
  });
  try {
    const parsed = JSON.parse(text);
    console.log('[editor_prescricao] parseLenient:strict-json-ok');
    return parsed;
  }
  catch (_) {
    console.log('[editor_prescricao] parseLenient:strict-json-failed, tentando modo leniente');
    const c = text
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/(^|\s)\/\/.*$/gm, '$1')
      .replace(/,\s*([}\]])/g, '$1');
    const parsed = JSON.parse(c);
    console.log('[editor_prescricao] parseLenient:lenient-json-ok');
    return parsed;
  }
}

async function loadFile(file) {
  console.log('[editor_prescricao] loadFile:called', {
    hasFile: !!file,
    name: file?.name,
    size: file?.size,
    type: file?.type
  });
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      console.log('[editor_prescricao] FileReader:onload', {
        hasResult: !!ev?.target?.result,
        resultType: typeof ev?.target?.result
      });
      try {
        const parsed = parseLenient(ev.target.result);
        normalizeLoadedData(parsed);
        console.log('[editor_prescricao] loadFile:parse-ok', {
          topLevelKeys: parsed && typeof parsed === 'object' ? Object.keys(parsed) : null
        });
        S.data = parsed;
        OPEN_ACCORDIONS.clear();
        MED_EDITOR_SECTION.clear();
        MED_EDITOR_MODE.clear();
        S.fileName = file.name;
        const chip = document.getElementById('fileChip');
        chip.textContent = file.name;
        chip.classList.remove('pop');
        void chip.offsetWidth;
        chip.classList.add('pop');
        console.log('[editor_prescricao] loadFile:ui-updated -> goToStep(0, true)');
        goToStep(0, true);
        console.log('[editor_prescricao] loadFile:finished-success');
        resolve();
      } catch (e) {
        console.error('[editor_prescricao] loadFile:parse-error', e);
        alert('Erro ao abrir arquivo:\n' + e.message + '\n\nVerifique se o arquivo é um JSON válido.');
        resolve();
      }
    };
    reader.onerror = () => {
      console.error('[editor_prescricao] FileReader:onerror', reader.error);
      alert('Erro ao ler o arquivo. Tente novamente.');
      resolve();
    };
    console.log('[editor_prescricao] FileReader:readAsText', { encoding: 'utf-8' });
    reader.readAsText(file, 'utf-8');
  });
}

document.getElementById('fileInput').addEventListener('change', e => {
  console.log('[editor_prescricao] fileInput:change', {
    filesCount: e?.target?.files?.length || 0,
    firstFile: e?.target?.files?.[0]?.name || null
  });
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

document.getElementById('reloadFileBtn').addEventListener('click', () => {
  const fileInput = document.getElementById('fileInput');
  // Limpa o value para permitir escolher o mesmo arquivo novamente.
  fileInput.value = '';
  console.log('[editor_prescricao] reloadFileBtn:click -> open file picker');
  fileInput.click();
});

window.addEventListener('error', (event) => {
  console.error('[editor_prescricao] window:error', {
    message: event.message,
    source: event.filename,
    line: event.lineno,
    column: event.colno,
    error: event.error
  });
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('[editor_prescricao] window:unhandledrejection', event.reason);
});

// ═══════════════════════════════════════════════
// WIZARD NAV
// ═══════════════════════════════════════════════
function goToStep(n, forceAnimate = false) {
  if (!S.data) {
    renderEmptyState();
    return;
  }
  const targetStep = Math.max(0, Math.min(STEPS.length - 1, n));
  const shouldAnimate = forceAnimate || S.step !== targetStep;
  S.step = targetStep;
  renderStepper();
  renderStep(shouldAnimate);
  updateFooter();
}
function updateFooter() {
  if (!S.data) {
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('stepCounter').textContent = 'Carregue um arquivo JSON para começar';
    return;
  }
  document.getElementById('prevBtn').disabled = S.step === 0;
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').textContent =
    S.step === STEPS.length - 1 ? '✓ Finalizar' : 'Avançar →';
  document.getElementById('stepCounter').textContent =
    'Passo ' + (S.step + 1) + ' de ' + STEPS.length;
}
document.getElementById('prevBtn').addEventListener('click', () => goToStep(S.step - 1));
document.getElementById('nextBtn').addEventListener('click', () => {
  if (S.step < STEPS.length - 1) goToStep(S.step + 1);
});

function renderStepper() {
  const nav = document.getElementById('stepper');
  nav.innerHTML = '';
  if (!S.data) return;
  STEPS.forEach((step, i) => {
    let cls = 'step-tab';
    if (i === S.step) cls += ' active';
    else if (i < S.step) cls += ' done';
    const tab = el('div', cls);
    tab.appendChild(el('span', 'step-num', i < S.step ? '✓' : String(i + 1)));
    tab.appendChild(document.createTextNode(' ' + step.label));
    tab.addEventListener('click', () => goToStep(i));
    nav.appendChild(tab);
  });
}

// ═══════════════════════════════════════════════
// STEP DISPATCHER
// ═══════════════════════════════════════════════
function renderStep(animate = false) {
  if (!S.data) {
    renderEmptyState();
    return;
  }
  const body = document.getElementById('wizBody');
  body.innerHTML = '';
  const id = STEPS[S.step].id;
  ({ info: stepInfo, perguntas: stepPerguntas, score: stepScore,
     alertas: stepAlertas, regras: stepRegras,
     medicamentos: stepMedicamentos, revisar: stepRevisar })[id](body);
  if (animate) animateStepEntrance();
}

function renderEmptyState() {
  const body = document.getElementById('wizBody');
  body.innerHTML = '';
  const box = el('div', 'empty-state');
  box.appendChild(el('h2', '', 'Comece carregando a prescrição'));
  box.appendChild(el('p', '', 'Abra um arquivo JSON para editar passo a passo e baixar a versão atualizada no final.'));

  const actions = el('div', 'empty-actions');
  const btn = el('button', 'btn btn-primary', 'Abrir arquivo .json');
  btn.type = 'button';
  btn.addEventListener('click', () => {
    const fileInput = document.getElementById('fileInput');
    fileInput.value = '';
    console.log('[editor_prescricao] emptyState:click -> open file picker');
    fileInput.click();
  });
  actions.appendChild(btn);
  actions.appendChild(el('span', 'empty-hint', 'Formato esperado: .json'));
  box.appendChild(actions);

  const drop = el('div', 'empty-drop');
  drop.setAttribute('role', 'button');
  drop.tabIndex = 0;
  const dropTitle = document.createElement('strong');
  dropTitle.textContent = 'Ou arraste o arquivo aqui';
  drop.appendChild(dropTitle);
  drop.appendChild(document.createTextNode('Clique nesta área para selecionar também.'));

  ['dragenter', 'dragover'].forEach((eventName) => {
    drop.addEventListener(eventName, (event) => {
      event.preventDefault();
      drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach((eventName) => {
    drop.addEventListener(eventName, (event) => {
      event.preventDefault();
      drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', (event) => {
    const file = event?.dataTransfer?.files?.[0];
    console.log('[editor_prescricao] emptyState:drop', {
      filesCount: event?.dataTransfer?.files?.length || 0,
      firstFile: file?.name || null,
    });
    if (file) loadFile(file);
  });
  drop.addEventListener('click', () => btn.click());
  drop.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      btn.click();
    }
  });

  box.appendChild(drop);
  body.appendChild(box);
  animateStepEntrance();
}

// ═══════════════════════════════════════════════
// STEP 0 – INFORMAÇÕES BÁSICAS
// ═══════════════════════════════════════════════
function stepInfo(p) {
  const d = S.data;
  mkTitle(p, 'Informações básicas', 'Dados gerais desta prescrição.');
  const card = el('div', 'card');
  const g = el('div', 'fg');

  const r1 = el('div', 'frow');
  r1.appendChild(mkField('Tipo de prescrição',
    mkSel(PRESC_TYPES, d.prescription_type, v => { d.prescription_type = v; })
  ));
  r1.appendChild(mkField('Status',
    mkSel(STATUS_OPTS, d.status, v => { d.status = v; })
  ));
  g.appendChild(r1);

  const r2 = el('div', 'frow');
  r2.appendChild(mkField('ID da prescrição',
    mkInp('text', d.prescription_id, v => { d.prescription_id = v; })
  ));
  r2.appendChild(mkField('ID do médico',
    mkInp('text', d.doctor_id, v => { d.doctor_id = v; })
  ));
  g.appendChild(r2);

  g.appendChild(mkField('Data', mkInp('date', d.date, v => { d.date = v; })));

  const obsEl = document.createElement('textarea');
  obsEl.rows = 3;
  obsEl.value = d.obs || '';
  obsEl.addEventListener('change', () => { d.obs = obsEl.value; });

}

function stepPerguntas(p) {

  if (!d.form_fields) d.form_fields = [];

    'Campos que aparecem na tela do médico durante o atendimento.');

    d.form_fields.push({
      field_id: 'campo_' + Date.now(),
      label: 'Nova pergunta',
      form_type: 'boolean',
      score: 1,
    });
    renderStep();
  });
  addRow.appendChild(addBtn);
  p.appendChild(addRow);

  d.form_fields.forEach((field, fi) => {
    const acc = mkAccordion(field.label || field.field_id,
      FIELD_TYPES.find(t => t.v === field.form_type)?.label || field.form_type,
      fi === 0,
      body => buildFieldEditor(body, field, fi),
      'pergunta-' + fi
    );
    p.appendChild(acc);

function buildFieldEditor(parent, field, fi) {
  const d = S.data;
  const g = el('div', 'fg');

  g.appendChild(mkField('Texto da pergunta',
    mkInp('text', field.label, v => { field.label = v; renderStep(); })
  ));

  g.appendChild(mkField('Tipo de campo',
    mkSel(FIELD_TYPES, field.form_type, v => {
      field.form_type = v;
      if (v === 'boolean' && field.score === undefined) field.score = 1;
      if (v === 'select' && !field.options) field.options = [];
      renderStep();
    })
  ));

  // Score for boolean
  if (field.form_type === 'boolean') {
    g.appendChild(mkField('Quantos pontos adiciona ao score quando marcado como SIM',
      mkSel([{v:0,label:'0 pontos'},{v:1,label:'1 ponto'},{v:2,label:'2 pontos'},{v:3,label:'3 pontos'}],
        field.score ?? 0, v => { field.score = Number(v); })
    ));
  }

  // Options for select
  if (field.form_type === 'select') {
    if (!field.options) field.options = [];
    const optWrap = el('div', 'field');
    optWrap.appendChild(el('label', null, 'Opções de seleção'));

    const chips = el('div', 'chips');
    field.options.forEach((opt, oi) => {
      const chip = el('span', 'chip', opt);
      const rm = el('span', 'chip-rm', ' ×');
      rm.addEventListener('click', () => { field.options.splice(oi, 1); renderStep(); });
      chip.appendChild(rm);
      chips.appendChild(chip);
    });
    optWrap.appendChild(chips);

    const addRow = el('div');
    addRow.style.cssText = 'display:flex;gap:8px';
    const optInp = mkInp('text', '', null, 'Escrever opção...');
    optInp.style.flex = '1';
    const addOpt = el('button', 'btn btn-add btn-sm', '+ Adicionar');
    addOpt.addEventListener('click', () => {
      if (optInp.value.trim()) {
        field.options.push(optInp.value.trim());
        renderStep();
      }
    });
    addRow.appendChild(optInp);
    addRow.appendChild(addOpt);
    optWrap.appendChild(addRow);
    g.appendChild(optWrap);
  }

  // Visible when
  const visWrap = el('div', 'field');
  visWrap.appendChild(el('label', null, 'Visível somente quando (deixe vazio para sempre exibir)'));
  if (!field.visible_when) field.visible_when = [];
  buildConditionsUI(visWrap, field.visible_when);
  g.appendChild(visWrap);

  mkHr(g);
  const rmRow = el('div', 'add-row');
  const rmBtn = el('button', 'btn btn-sm btn-danger', '🗑 Remover esta pergunta');
  rmBtn.addEventListener('click', () => { d.form_fields.splice(fi, 1); renderStep(); });
  rmRow.appendChild(rmBtn);
  g.appendChild(rmRow);

  parent.appendChild(g);
}

// STEP 5 – MEDICAMENTOS
// ═══════════════════════════════════════════════
function stepMedicamentos(p) {
  const d = S.data;
  if (!d.medications) d.medications = [];

  mkTitle(p, 'Medicamentos',
    'Configure cada medicamento com posologia e apresentações disponíveis.');

  const layout = el('div', 'med-layout');
  const main = el('div', 'med-main');
  const side = el('aside', 'med-side');

  const addRow = el('div', 'add-row');
  const addBtn = el('button', 'btn btn-add btn-sm', '+ Adicionar medicamento');
  addBtn.addEventListener('click', () => {
    d.medications.push({
      medication_id: 'med_' + Date.now(),
      name: 'Novo medicamento',
      category: 'Antibióticos',
      contraindications: [],
      observation: '',
      default_frequency_hours: 12,
      default_duration_days: 7,
      default_posology_idx: 0,
      posology: [{
        default_dosage: 0,
        dosage_unit: 'mg',
        min_daily_dose_per_kg: 0,
        max_daily_dose_per_kg: 0,
        max_daily_dose_absolute: 0,
        administration: 'oral',
        age_month_min: 0,
        age_month_max: 216,
        fixed_dosage: false,
        presentations: [],
      }],
    });
    renderStep();
  });
  addRow.appendChild(addBtn);
  main.appendChild(addRow);

  d.medications.forEach((med, mi) => {
    const compact = formatPosologyLine(med);
    const posCount = Array.isArray(med.posology) ? med.posology.length : 0;
    const presCount = Array.isArray(med.posology)
      ? med.posology.reduce((sum, pos) => sum + (Array.isArray(pos.presentations) ? pos.presentations.length : 0), 0)
      : 0;
    const tags = getMedicationTags(med);
    const acc = mkAccordion(
      med.name || med.medication_id,
      compact + ' • ' + presCount + ' apresentações' + (tags.length ? ' • ' + tags.join(' / ') : ''),
      false,
      body => buildMedEditor(body, med, mi),
      'med-' + mi
    );
    main.appendChild(acc);
  });

  buildMedicationSidebar(side, d);

  layout.appendChild(main);
  layout.appendChild(side);
  p.appendChild(layout);
}

function buildMedicationSidebar(parent, d) {
  const meds = Array.isArray(d.medications) ? d.medications : [];
  const totalPos = meds.reduce((sum, med) => sum + (Array.isArray(med.posology) ? med.posology.length : 0), 0);
  const totalPres = meds.reduce((sum, med) => sum + (Array.isArray(med.posology)
    ? med.posology.reduce((acc, pos) => acc + (Array.isArray(pos.presentations) ? pos.presentations.length : 0), 0)
    : 0), 0);
  const noPos = meds.filter((med) => !Array.isArray(med.posology) || med.posology.length === 0).length;
  const noPres = meds.reduce((sum, med) => sum + (Array.isArray(med.posology)
    ? med.posology.filter((pos) => !Array.isArray(pos.presentations) || pos.presentations.length === 0).length
    : 0), 0);
  const antibiotics = meds.filter((m) => String(m.category || '').toLowerCase().includes('antib')).length;
  const sos = meds.filter((m) => Number(m.default_duration_days) === 0).length;
  const continuous = meds.filter((m) => Number(m.default_duration_days) >= 14).length;
  const maxDuration = meds.reduce((max, m) => Math.max(max, Number(m.default_duration_days) || 0), 0);

  const summary = el('div', 'med-side-card');
  summary.appendChild(el('div', 'med-side-title', 'Resumo Clínico'));
  const kpi = el('div', 'med-kpi');
  const rows = [
    ['Medicamentos', meds.length],
    ['Antibióticos', antibiotics],
    ['Posologias', totalPos],
    ['Apresentações', totalPres],
    ['Se necessário', sos],
    ['Contínuos', continuous],
    ['Duração máx', maxDuration + ' d'],
    ['Pendências', noPos + noPres],
  ];
  rows.forEach((item) => {
    const card = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = String(item[1]);
    card.appendChild(strong);
    card.appendChild(document.createTextNode(item[0]));
    kpi.appendChild(card);
  });
  summary.appendChild(kpi);
  parent.appendChild(summary);

  const pending = el('div', 'med-side-card');
  pending.appendChild(el('div', 'med-side-title', 'Checagem Rápida'));
  const list = document.createElement('ul');
  list.style.margin = '0';
  list.style.paddingLeft = '16px';
  list.style.display = 'grid';
  list.style.gap = '4px';
  list.style.fontSize = '0.82rem';
  list.style.color = '#334155';
  const a = document.createElement('li');
  a.textContent = noPos ? (noPos + ' medicamento(s) sem posologia.') : 'Todos os medicamentos têm posologia.';
  const b = document.createElement('li');
  b.textContent = noPres ? (noPres + ' posologia(s) sem apresentação.') : 'Todas as posologias têm apresentação.';
  list.appendChild(a);
  list.appendChild(b);
  pending.appendChild(list);
  parent.appendChild(pending);
}

function buildMedEditor(parent, med, mi) {
  const d = S.data;
  if (!med.posology) med.posology = [];
  if (!med.contraindications) med.contraindications = [];

  const nav = el('div', 'section-tabs');
  const modeWrap = el('div', 'mode-tabs');
  const mode = getMedMode(mi);
  const viewBtn = el('button', 'mode-tab-btn' + (mode === 'view' ? ' active' : ''), 'Visualização');
  viewBtn.type = 'button';
  viewBtn.addEventListener('click', () => { setMedMode(mi, 'view'); renderStep(); });
  const editBtn = el('button', 'mode-tab-btn' + (mode === 'edit' ? ' active' : ''), 'Edição');
  editBtn.type = 'button';
  editBtn.addEventListener('click', () => { setMedMode(mi, 'edit'); renderStep(); });
  modeWrap.appendChild(viewBtn);
  modeWrap.appendChild(editBtn);
  parent.appendChild(modeWrap);

  const sections = [
    { id: 'dados', label: 'Dados principais' },
    { id: 'posologia', label: 'Posologia' },
    { id: 'apresentacoes', label: 'Apresentações' },
    { id: 'observacoes', label: 'Observações' },
  ];
  const current = getMedSection(mi);
  sections.forEach((s) => {
    const btn = el('button', 'section-tab-btn' + (current === s.id ? ' active' : ''), s.label);
    btn.type = 'button';
    btn.addEventListener('click', () => {
      setMedSection(mi, s.id);
      renderStep();
    });
    nav.appendChild(btn);
  });
  parent.appendChild(nav);

  if (mode === 'view') {
    const chips = el('div', 'clinical-chips');
    chips.appendChild(el('span', 'clinical-chip accent', formatPosologyLine(med)));
    chips.appendChild(el('span', 'clinical-chip', med.category || 'Sem categoria'));
    getMedicationTags(med).forEach((t) => chips.appendChild(el('span', 'clinical-chip', t)));
    parent.appendChild(chips);

    const vgrid = el('div', 'clinical-view-grid');
    const posCount = Array.isArray(med.posology) ? med.posology.length : 0;
    const presCount = Array.isArray(med.posology)
      ? med.posology.reduce((sum, pos) => sum + (Array.isArray(pos.presentations) ? pos.presentations.length : 0), 0)
      : 0;
    const a = el('div', 'clinical-view-item'); a.innerHTML = '<strong>Posologias</strong><br>' + posCount;
    const b = el('div', 'clinical-view-item'); b.innerHTML = '<strong>Apresentações</strong><br>' + presCount;
    const c = el('div', 'clinical-view-item'); c.innerHTML = '<strong>Frequência</strong><br>' + fmtFrequency(med.default_frequency_hours);
    const d = el('div', 'clinical-view-item'); d.innerHTML = '<strong>Duração</strong><br>' + fmtDuration(med.default_duration_days);
    [a,b,c,d].forEach((n) => vgrid.appendChild(n));
    parent.appendChild(vgrid);
  }

  const g = el('div', 'fg');

  if (current === 'dados' && mode === 'edit') {
    const r1 = el('div', 'frow');
    r1.appendChild(mkField('Nome do medicamento',
      mkInp('text', med.name, v => { med.name = v; renderStep(); })
    ));
    r1.appendChild(mkField('Categoria',
      mkSel(CATEGORIES, med.category, v => { med.category = v; })
    ));
    g.appendChild(r1);

    g.appendChild(mkField('ID interno',
      mkInp('text', med.medication_id, v => { med.medication_id = v; })
    ));

    const r2 = el('div', 'frow');
    r2.appendChild(mkField('Frequência padrão',
      mkSel(FREQUENCIES, med.default_frequency_hours,
        v => { med.default_frequency_hours = Number(v); renderStep(); })
    ));
    r2.appendChild(mkField('Duração padrão',
      mkSel(DURATIONS, med.default_duration_days,
        v => { med.default_duration_days = Number(v); renderStep(); })
    ));
    g.appendChild(r2);
  }

  if (current === 'posologia' && mode === 'edit') {
    med.posology.forEach((pos, pi) => {
      g.appendChild(buildPosologyBlock(pos, med, mi, pi));
    });

    const addPosBtn = el('button', 'btn btn-sm btn-add', '+ Adicionar faixa de posologia');
    addPosBtn.addEventListener('click', () => {
      med.posology.push({
        default_dosage: 0, dosage_unit: 'mg',
        min_daily_dose_per_kg: 0, max_daily_dose_per_kg: 0,
        max_daily_dose_absolute: 0, administration: 'oral',
        age_month_min: 0, age_month_max: 216,
        fixed_dosage: false,
        presentations: [],
      });
      renderStep();
    });
    g.appendChild(addPosBtn);
  }

  if (current === 'apresentacoes') {
    const block = el('div', 'card');
    block.appendChild(el('div', 'card-title', 'Apresentações por posologia'));

    let hasRows = 0;
    med.posology.forEach((pos, pi) => {
      const group = el('div', 'pos-group');
      const ghead = el('div', 'pos-group-head');
      ghead.appendChild(el('span', null, 'Posologia ' + (pi + 1) + ' • ' + ((pos.presentations || []).length) + ' apresentação(ões)'));
      ghead.appendChild(el('small', null, (pos.default_dosage ?? 0) + ' ' + (pos.dosage_unit || 'mg') + ' • ' + (pos.administration || 'oral')));
      group.appendChild(ghead);

      const table = el('div', 'pres-table');
      const head = el('div', 'pres-table-head');
      ['Padrão', 'Apresentação', 'Unid.', 'Origem', 'Fator', 'Ações'].forEach((h) => {
        head.appendChild(el('div', null, h));
      });
      table.appendChild(head);

      const items = Array.isArray(pos.presentations) ? pos.presentations : [];
      items.forEach((pres, pri) => {
        normalizePresentationData(pres);
        hasRows += 1;
        const row = el('div', 'pres-table-row');
        row.appendChild(el('div', null, Number(pos.default_presentation_idx || 0) === pri ? 'Sim' : '—'));
        row.appendChild(el('div', null, pres.presentation_type || 'Sem descrição'));
        row.appendChild(el('div', null, pres.presentation_unit || '-'));
        row.appendChild(el('div', null, pres.from_unit || (pos.dosage_unit || 'mg')));
        row.appendChild(el('div', null, String(pres.conversion_factor ?? 0)));

        const actions = el('div', 'pres-actions');
        const isDefault = Number(pos.default_presentation_idx || 0) === pri;
        if (!isDefault) {
          const defBtn = el('button', 'btn-xs primary', 'Padrão');
          defBtn.type = 'button';
          defBtn.addEventListener('click', () => {
            pos.default_presentation_idx = pri;
            renderStep();
          });
          actions.appendChild(defBtn);
        }
        const editBtn = el('button', 'btn-xs', 'Editar');
        editBtn.type = 'button';
        editBtn.addEventListener('click', () => {
          setMedSection(mi, 'posologia');
          OPEN_ACCORDIONS.add('med-' + mi + '-pos-' + pi);
          OPEN_ACCORDIONS.add('med-' + mi + '-pos-' + pi + '-pres-' + pri);
          renderStep();
        });
        actions.appendChild(editBtn);

        const rmBtn = el('button', 'btn-xs danger', 'Remover');
        rmBtn.type = 'button';
        rmBtn.addEventListener('click', () => {
          pos.presentations.splice(pri, 1);
          if (Number(pos.default_presentation_idx || 0) >= pos.presentations.length) {
            pos.default_presentation_idx = Math.max(0, pos.presentations.length - 1);
          }
          renderStep();
        });
        actions.appendChild(rmBtn);
        row.appendChild(actions);
        table.appendChild(row);
      });

      const rowActions = el('div', 'add-row');
      rowActions.style.padding = '8px 10px';
      const addThis = el('button', 'btn btn-sm btn-add', '+ Adicionar apresentação nesta posologia');
      addThis.addEventListener('click', () => {
        if (!pos.presentations) pos.presentations = [];
        pos.presentations.push({
          presentation_type: '', presentation_unit: 'ml', from_unit: pos.dosage_unit || 'mg', conversion_factor: 0,
        });
        setMedSection(mi, 'posologia');
        OPEN_ACCORDIONS.add('med-' + mi + '-pos-' + pi);
        renderStep();
      });
      rowActions.appendChild(addThis);
      table.appendChild(rowActions);
      group.appendChild(table);
      block.appendChild(group);
    });

    if (!hasRows) {
      block.appendChild(el('p', 'empty-note', 'Nenhuma apresentação cadastrada ainda.'));
    }

    g.appendChild(block);
  }

  if (current === 'observacoes' && mode === 'edit') {
    const obsEl = document.createElement('textarea');
    obsEl.rows = 3;
    obsEl.value = med.observation || '';
    obsEl.addEventListener('change', () => { med.observation = obsEl.value; });
    g.appendChild(mkField('Observação clínica', obsEl));

    const ciWrap = el('div', 'field');
    ciWrap.appendChild(el('label', null, 'Contraindicações (não prescrever quando)'));
    buildConditionsUI(ciWrap, med.contraindications);
    g.appendChild(ciWrap);
  }

  if (mode === 'edit') {
    mkHr(g);
    const rmRow = el('div', 'add-row');
    const rmBtn = el('button', 'btn btn-sm btn-danger', '🗑 Remover este medicamento');
    rmBtn.addEventListener('click', () => { d.medications.splice(mi, 1); renderStep(); });
    rmRow.appendChild(rmBtn);
    g.appendChild(rmRow);
  }

  parent.appendChild(g);
}

function buildPosologyBlock(pos, med, mi, pi) {
  const accordionId = 'med-' + mi + '-pos-' + pi;
  const box = el('div', 'accordion');
  box.style.marginTop = '10px';

  const head = el('div', 'accordion-head');
  const left = el('div');
  left.style.display = 'grid';
  left.style.gap = '2px';
  const titleEl = el('span', 'accordion-title', 'Posologia ' + (pi + 1));
  const summaryEl = el('span', 'pres-label');
  summaryEl.style.textTransform = 'none';
  summaryEl.style.letterSpacing = '0';
  left.appendChild(titleEl);
  left.appendChild(summaryEl);
  head.appendChild(left);

  function fmtAgeRange(min, max) {
    const hasMin = Number.isFinite(min);
    const hasMax = Number.isFinite(max);
    if (hasMin && hasMax) {
      if (min === max) return min + ' meses';
      return min + ' a ' + max + ' meses';
    }
    if (hasMin) return 'a partir de ' + min + ' meses';
    if (hasMax) return 'até ' + max + ' meses';
    return 'todas as idades';
  }

  function updateSummary() {
    const dose = (pos.default_dosage ?? 0) + ' ' + (pos.dosage_unit || 'mg');
    const age = fmtAgeRange(
      Number(pos.age_month_min),
      Number(pos.age_month_max)
    );
    const totalPres = Array.isArray(pos.presentations) ? pos.presentations.length : 0;
    const defaultIdx = Number.isFinite(Number(pos.default_presentation_idx))
      ? Number(pos.default_presentation_idx)
      : 0;
    const defaultPres = totalPres > 0 ? pos.presentations[Math.max(0, Math.min(defaultIdx, totalPres - 1))] : null;
    const presText = defaultPres
      ? ('Padrão: ' + (defaultPres.presentation_type || ('Apresentação ' + (defaultIdx + 1))))
      : 'Sem apresentações';
    summaryEl.textContent =
      'Dose padrão: ' + dose +
      ' | Idade: ' + age +
      ' | Apresentações: ' + totalPres +
      ' | ' + presText;
  }

  const startsOpen = OPEN_ACCORDIONS.has(accordionId);
  const meta = el('div', 'accordion-meta');
  const rmBtn = el('button', 'btn btn-sm btn-danger', '🗑');
  rmBtn.addEventListener('click', e => {
    e.stopPropagation();
    med.posology.splice(pi, 1);
    renderStep();
  });
  meta.appendChild(rmBtn);
  const arrow = el('span', 'acc-arrow' + (startsOpen ? ' open' : ''), '▾');
  meta.appendChild(arrow);
  head.appendChild(meta);

  const body = el('div', 'accordion-body' + (startsOpen ? ' open' : ''));

  function setOpen(nextOpen) {
    body.classList.toggle('open', nextOpen);
    arrow.classList.toggle('open', nextOpen);
    if (nextOpen) OPEN_ACCORDIONS.add(accordionId);
    else OPEN_ACCORDIONS.delete(accordionId);
    syncAccordionHeight(body, nextOpen);
  }

  head.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    setOpen(!body.classList.contains('open'));
  });

  const g = el('div', 'fg');

  const r1 = el('div', 'frow');
  r1.appendChild(mkField('Dose padrão', mkInp('number', pos.default_dosage, v => {
    pos.default_dosage = v;
    updateSummary();
  })));
  r1.appendChild(mkField('Unidade da dose', mkSel(DOSAGE_UNITS, pos.dosage_unit, v => {
    pos.dosage_unit = v;
    updateSummary();
  })));
  g.appendChild(r1);

  const r2 = el('div', 'frow');
  r2.appendChild(mkField('Dose mínima por kg/dia', mkInp('number', pos.min_daily_dose_per_kg, v => { pos.min_daily_dose_per_kg = v; })));
  r2.appendChild(mkField('Dose máxima por kg/dia', mkInp('number', pos.max_daily_dose_per_kg, v => { pos.max_daily_dose_per_kg = v; })));
  g.appendChild(r2);

  const r3 = el('div', 'frow');
  r3.appendChild(mkField('Dose máxima absoluta', mkInp('number', pos.max_daily_dose_absolute, v => { pos.max_daily_dose_absolute = v; })));
  r3.appendChild(mkField('Via de administração', mkSel(ADMIN_ROUTES, pos.administration, v => { pos.administration = v; })));
  g.appendChild(r3);

  const r4 = el('div', 'frow');
  r4.appendChild(mkField('Idade mínima (meses)', mkInp('number', pos.age_month_min, v => {
    pos.age_month_min = v;
    updateSummary();
  })));
  r4.appendChild(mkField('Idade máxima (meses)', mkInp('number', pos.age_month_max, v => {
    pos.age_month_max = v;
    updateSummary();
  })));
  g.appendChild(r4);

  g.appendChild(mkField('Dose fixa (não calcula pelo peso)',
    mkSel([{v:'false',label:'Não – calcular pelo peso'},{v:'true',label:'Sim – dose fixa independente do peso'}],
      String(!!pos.fixed_dosage), v => { pos.fixed_dosage = v === 'true'; })
  ));

  const filterWrap = el('div', 'field');
  filterWrap.appendChild(el('label', null, 'Exibir esta posologia somente quando (vazio = sempre)'));
  if (!pos.filters) pos.filters = [];
  buildConditionsUI(filterWrap, pos.filters);
  g.appendChild(filterWrap);

  mkHr(g);

  const presTitle = el('strong', null, 'Apresentações');
  presTitle.style.fontSize = '.9rem';
  g.appendChild(presTitle);

  if (!pos.presentations) pos.presentations = [];
  if (!Number.isFinite(Number(pos.default_presentation_idx))) {
    pos.default_presentation_idx = 0;
  }

  if (pos.presentations.length) {
    const options = pos.presentations.map((pres, idx) => ({
      v: String(idx),
      label: (idx + 1) + '. ' + (pres.presentation_type || 'Sem descrição')
    }));
    g.appendChild(mkField('Apresentação padrão',
      mkSel(options, String(pos.default_presentation_idx), v => {
        pos.default_presentation_idx = Number(v);
        renderStep();
      })
    ));
  } else {
    g.appendChild(el('p', 'empty-note', 'Nenhuma apresentação cadastrada ainda.'));
  }

  pos.presentations.forEach((pres, pri) => {
    g.appendChild(buildPresBlock(pres, pos, mi, pi, pri));
  });

  const addPresBtn = el('button', 'btn btn-sm btn-add');
  addPresBtn.style.marginTop = '8px';
  addPresBtn.textContent = '+ Adicionar apresentação';
  addPresBtn.addEventListener('click', () => {
    pos.presentations.push({
      presentation_type: '', presentation_unit: 'ml',
      from_unit: pos.dosage_unit || 'mg', conversion_factor: 0,
    });
    if (pos.presentations.length === 1) pos.default_presentation_idx = 0;
    renderStep();
  });
  g.appendChild(addPresBtn);

  body.appendChild(g);
  box.appendChild(head);
  box.appendChild(body);
  syncAccordionHeight(body, startsOpen);
  updateSummary();
  return box;
}

function buildPresBlock(pres, pos, mi, pi, pri) {
  normalizePresentationData(pres);
  const accordionId = 'med-' + mi + '-pos-' + pi + '-pres-' + pri;
  const startsOpen = OPEN_ACCORDIONS.has(accordionId);
  const box = el('div', 'accordion');
  box.style.marginBottom = '8px';

  const head = el('div', 'accordion-head');
  const left = el('div');
  left.style.display = 'grid';
  left.style.gap = '2px';
  left.appendChild(el('span', 'pres-label', 'Apresentação ' + (pri + 1)));
  const summaryEl = el('span', 'pres-label');
  summaryEl.style.textTransform = 'none';
  summaryEl.style.letterSpacing = '0';
  summaryEl.style.fontWeight = '600';
  left.appendChild(summaryEl);
  head.appendChild(left);

  function updateSummary() {
    const type = pres.presentation_type || 'Sem descrição';
    const unit = pres.presentation_unit || '-';
    const from = pres.from_unit || (pos.dosage_unit || 'mg');
    const factor = pres.conversion_factor ?? 0;
    summaryEl.textContent = type + ' | ' + unit + ' <- ' + from + ' | fator: ' + factor;
  }

  const meta = el('div', 'accordion-meta');
  const isDefault = Number(pos.default_presentation_idx || 0) === pri;
  if (isDefault) {
    const defBadge = el('span', 'acc-badge', 'Padrão');
    defBadge.style.background = '#dcfce7';
    defBadge.style.color = '#166534';
    meta.appendChild(defBadge);
  }
  if (!isDefault) {
    const defBtn = el('button', 'btn btn-sm btn-add', 'Definir padrão');
    defBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      pos.default_presentation_idx = pri;
      renderStep();
    });
    meta.appendChild(defBtn);
  }

  const rmBtn = el('button', 'btn btn-sm btn-danger', '🗑 Remover');
  rmBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    pos.presentations.splice(pri, 1);
    const nextLen = pos.presentations.length;
    if (!nextLen) {
      pos.default_presentation_idx = 0;
    } else if (Number(pos.default_presentation_idx || 0) >= nextLen) {
      pos.default_presentation_idx = nextLen - 1;
    }
    renderStep();
  });
  meta.appendChild(rmBtn);

  const arrow = el('span', 'acc-arrow' + (startsOpen ? ' open' : ''), '▾');
  meta.appendChild(arrow);
  head.appendChild(meta);

  const body = el('div', 'accordion-body' + (startsOpen ? ' open' : ''));

  function setOpen(nextOpen) {
    body.classList.toggle('open', nextOpen);
    arrow.classList.toggle('open', nextOpen);
    if (nextOpen) OPEN_ACCORDIONS.add(accordionId);
    else OPEN_ACCORDIONS.delete(accordionId);
    syncAccordionHeight(body, nextOpen);
  }

  head.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    setOpen(!body.classList.contains('open'));
  });

  const content = el('div', 'fg');

  const typeInp = mkInp('text', pres.presentation_type, v => { pres.presentation_type = v; renderStep(); });
  typeInp.placeholder = 'Ex.: Suspensão oral 250 mg/5 mL';
  content.appendChild(mkField('Descrição da forma farmacêutica', typeInp));

  const grid = el('div', 'pres-grid');

  const unitOptions = [...PRES_UNITS];
  if (pres.presentation_unit && !unitOptions.includes(pres.presentation_unit)) {
    unitOptions.unshift(pres.presentation_unit);
  }

  const unitWrap = el('div', 'field');
  unitWrap.appendChild(el('label', null, 'Unidade de medida'));
  unitWrap.appendChild(mkSel(unitOptions, pres.presentation_unit, v => {
    const changed = String(pres.presentation_unit || '') !== String(v || '');
    pres.presentation_unit = v;
    if (changed) pres.presentation_notes = '';
    renderStep();
  }));
  grid.appendChild(unitWrap);

  const fromWrap = el('div', 'field');
  fromWrap.appendChild(el('label', null, 'Unidade de origem'));
  fromWrap.appendChild(mkSel(DOSAGE_UNITS, pres.from_unit || (pos.dosage_unit || 'mg'), v => {
    pres.from_unit = v;
    renderStep();
  }));
  grid.appendChild(fromWrap);

  const cfWrap = el('div', 'field');
  cfWrap.appendChild(el('label', null, 'Fator de conversão (1 unidade = X unidade de origem)'));
  cfWrap.appendChild(mkInp('number', pres.conversion_factor, v => { pres.conversion_factor = v; updateSummary(); }));
  grid.appendChild(cfWrap);

  content.appendChild(grid);

  const notesEl = document.createElement('textarea');
  notesEl.rows = 2;
  notesEl.value = pres.presentation_notes || '';
  notesEl.placeholder = 'Observações da apresentação (ex.: 4 ml, 2 aplicações em musculaturas diferentes)';
  notesEl.addEventListener('change', () => {
    pres.presentation_notes = notesEl.value;
    renderStep();
  });
  content.appendChild(mkField('Observações da apresentação', notesEl));

  const filtersWrap = el('div', 'field');
  filtersWrap.style.marginTop = '8px';
  filtersWrap.appendChild(el('label', null, 'Exibir somente quando (filtros)'));
  if (!pres.filters) pres.filters = [];
  buildConditionsUI(filtersWrap, pres.filters);
  content.appendChild(filtersWrap);

  body.appendChild(content);
  box.appendChild(head);
  box.appendChild(body);
  syncAccordionHeight(body, startsOpen);
  updateSummary();
  return box;
}

function stepRevisar(p) {
  mkTitle(p, 'Revisar e baixar', 'Confira o JSON final antes de fazer o download.');

  const dlCard = el('div', 'dl-card');
  const h2 = el('h2', null, '🎉 Tudo pronto!');
  const desc = el('p', null, 'Clique no botão para baixar o arquivo editado.');
  const dlBtn = el('button', 'btn btn-primary', '⬇ Baixar JSON editado');
  dlBtn.style.fontSize = '1.05rem';
  dlBtn.style.padding = '14px 32px';
  dlBtn.addEventListener('click', doDownload);
  dlCard.appendChild(h2);
  dlCard.appendChild(desc);
  dlCard.appendChild(dlBtn);
  p.appendChild(dlCard);

  const pre = el('pre', 'json-preview');
  pre.textContent = JSON.stringify(S.data, null, 2);
  p.appendChild(pre);
}

// ═══════════════════════════════════════════════
// CONDITIONS BUILDER (reutilizável)
// ═══════════════════════════════════════════════
function buildConditionsUI(parent, arr) {
  function render() {
    const existing = parent.querySelector('.cond-container');
    if (existing) existing.remove();

    const container = el('div', 'cond-container');

    if (!arr.length) {
      container.appendChild(el('p', 'empty-note', 'Nenhuma condição – sempre ativo.'));
    }

    const list = el('div', 'conditions-list');
    arr.forEach((cond, ci) => {
      const row = el('div', 'cond-row');

      const fieldSel = mkSel(getFieldIds(), cond.field_id, v => {
        cond.field_id = v;
        const nextType = getFieldType(v);
        if (nextType === 'boolean') cond.value = !!cond.value;
        else if (nextType === 'number' || nextType === 'age' || nextType === 'weight') {
          cond.value = Number.isFinite(Number(cond.value)) ? Number(cond.value) : 0;
        }
        else if (nextType === 'select') {
          const opts = getFieldOptions(v);
          cond.value = opts.length ? String(opts[0].v) : '';
        }
        else {
          cond.value = cond.value !== undefined && cond.value !== null ? String(cond.value) : '';
        }
        render();
      });

      const opSel = mkSel(OPERATORS, cond.operator, v => { cond.operator = v; });

      const fieldType = getFieldType(cond.field_id);
      const isBoolean = fieldType === 'boolean';
      const isNumeric = fieldType === 'number' || fieldType === 'age' || fieldType === 'weight';
      const isSelect = fieldType === 'select';
      let valCtrl;
      if (isBoolean) {
        valCtrl = mkSel(BOOL_COND_OPTS, String(cond.value), v => { cond.value = v === 'true'; });
      } else if (isSelect) {
        const opts = getFieldOptions(cond.field_id);
        if (opts.length) {
          const current = cond.value !== undefined && cond.value !== null ? String(cond.value) : String(opts[0].v);
          valCtrl = mkSel(opts, current, v => { cond.value = v; });
        } else {
          valCtrl = mkInp('text', cond.value !== undefined && cond.value !== null ? String(cond.value) : '',
            v => { cond.value = v; }, 'valor');
        }
      } else if (isNumeric) {
        valCtrl = mkInp('number', cond.value !== undefined ? cond.value : 0,
          v => { cond.value = v; });
      } else {
        valCtrl = mkInp('text', cond.value !== undefined && cond.value !== null ? String(cond.value) : '',
          v => { cond.value = v; }, 'valor');
      }

      const rmBtn = el('button', 'btn btn-sm btn-danger', '×');
      rmBtn.addEventListener('click', () => { arr.splice(ci, 1); render(); });

      row.appendChild(fieldSel);
      row.appendChild(opSel);
      row.appendChild(valCtrl);
      row.appendChild(rmBtn);
      list.appendChild(row);
    });

    container.appendChild(list);

    const addBtn = el('button', 'btn btn-sm btn-add', '+ Adicionar condição');
    addBtn.style.marginTop = '4px';
    addBtn.addEventListener('click', () => {
      const firstField = getFieldIds()[0] || 'score';
      const firstType = getFieldType(firstField);
      let firstValue = 0;
      if (firstType === 'boolean') firstValue = false;
      else if (firstType === 'select') {
        const opts = getFieldOptions(firstField);
        firstValue = opts.length ? String(opts[0].v) : '';
      }
      else if (!(firstType === 'number' || firstType === 'age' || firstType === 'weight')) firstValue = '';
      arr.push({ field_id: firstField, operator: '>=', value: firstValue });
      render();
    });
    container.appendChild(addBtn);
    parent.appendChild(container);
  }
  render();
}

// ═══════════════════════════════════════════════
// RESULTS BUILDER (para rules)
// ═══════════════════════════════════════════════
function buildResultsUI(parent, arr) {
  function render() {
    const existing = parent.querySelector('.results-container');
    if (existing) existing.remove();

    const container = el('div', 'results-container');
    const medIds = getMedIds();

    if (!arr.length) {
      container.appendChild(el('p', 'empty-note', 'Nenhum resultado definido.'));
    }

    arr.forEach((res, ri) => {
      const box = el('div', 'pres-item');

      const head = el('div', 'pres-head');
      head.appendChild(el('span', 'pres-label', 'Resultado ' + (ri + 1)));
      const rmBtn = el('button', 'btn btn-sm btn-danger', '×');
      rmBtn.addEventListener('click', () => { arr.splice(ri, 1); render(); });
      head.appendChild(rmBtn);
      box.appendChild(head);

      box.appendChild(mkField('Tipo de resultado',
        mkSel(RESULT_TYPES, res.item_type || 'medication', v => {
          res.item_type = v;
          render();
        })
      ));

      if (!res.item_type || res.item_type === 'medication') {
        if (medIds.length) {
          box.appendChild(mkField('Medicamento',
            mkSel(medIds, res.medication_id, v => { res.medication_id = v; })
          ));
        } else {
          const note = el('p', 'empty-note', 'Nenhum medicamento cadastrado ainda. Cadastre na etapa Medicamentos.');
          box.appendChild(note);
        }
      }

      const bodyEl = document.createElement('textarea');
      bodyEl.rows = 2;
      bodyEl.value = res.body || '';
      bodyEl.placeholder = 'Ex.: Amoxicilina 50mg/kg/dia';
      bodyEl.addEventListener('change', () => { res.body = bodyEl.value; });
      box.appendChild(mkField('Texto descritivo', bodyEl));

      container.appendChild(box);
    });

    const addBtn = el('button', 'btn btn-sm btn-add', '+ Adicionar resultado');
    addBtn.style.marginTop = '6px';
    addBtn.addEventListener('click', () => {
      arr.push({
        item_type: 'medication',
        item_id: 'item_' + Date.now(),
        medication_id: medIds[0] || '',
        body: '',
      });
      render();
    });
    container.appendChild(addBtn);
    parent.appendChild(container);
  }
  render();
}

// ═══════════════════════════════════════════════
// DOWNLOAD
// ═══════════════════════════════════════════════
function buildExportData() {
  const out = JSON.parse(JSON.stringify(S.data));
  if (!out || !Array.isArray(out.medications)) return out;

  out.medications.forEach((med) => {
    if (!Array.isArray(med.posology)) return;
    med.posology.forEach((pos) => {
      if (!Array.isArray(pos.presentations)) return;
      pos.presentations.forEach((pres) => {
        const baseUnit = String(pres.presentation_unit || '').trim();
        const notes = String(pres.presentation_notes || '').trim();
        if (baseUnit && notes) {
          pres.presentation_unit = `${baseUnit} (${notes})`;
        } else if (baseUnit) {
          pres.presentation_unit = baseUnit;
        } else if (notes) {
          pres.presentation_unit = notes;
        }
      });
    });
  });

  return out;
}

function doDownload() {
  const exportData = buildExportData();
  const output = JSON.stringify(exportData, null, 2);
  const blob = new Blob([output], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = S.fileName.replace(/\.json$/i, '') + '_editado.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Download iniciado!');
}
